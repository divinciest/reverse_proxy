settings:
  # Let's Encrypt account email. Leave empty to register without one
  # (Let's Encrypt no longer sends expiry mail; placeholder addresses are rejected).
  email: ""
  certbot_path: "/usr/bin/certbot"
  # true = use the Let's Encrypt staging CA (for testing; untrusted certificates)
  staging: false

