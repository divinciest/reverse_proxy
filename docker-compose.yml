services:
  # Generic Reverse Proxy
  # Host networking: backend templates proxy to http://localhost:<port>, which
  # must be the host itself, not the container.
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./templates:/app/templates
      - ./static:/var/www/html
      - ./letsencrypt:/etc/letsencrypt
      - ./logs:/var/log/nginx
      - ./web:/var/www/html/advisorassist  # Mount the existing web app
    restart: always
    environment:
      - CONFIG_FILE=/app/config/hosts.yaml
      # Optional overrides (seconds):
      # - RENEW_INTERVAL_SECONDS=43200
      # - RENEW_MAX_JITTER_SECONDS=3600
